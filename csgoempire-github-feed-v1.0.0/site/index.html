<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSGOEmpire Betting Feed</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:820px;margin:40px auto;padding:0 20px;line-height:1.5;color:#171717}
    .card{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}
    code{background:#f4f4f4;padding:2px 6px;border-radius:6px;word-break:break-all}
    .ok{font-weight:700}.muted{color:#666}
  </style>
</head>
<body>
  <h1>CSGOEmpire Betting Feed</h1>
  <p class="muted">Feed público gerado automaticamente pelo GitHub Actions.</p>
  <div class="card">
    <div><a href="./latest-6h.json">latest-6h.json</a></div>
    <div id="s6" class="muted">Verificando...</div>
  </div>
  <div class="card">
    <div><a href="./latest-24h.json">latest-24h.json</a></div>
    <div id="s24" class="muted">Verificando...</div>
  </div>
  <script>
    async function status(file, el){
      try{
        const r=await fetch(file+'?t='+Date.now(),{cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const j=await r.json();
        const total=j?.totals?.all_events ?? '—';
        const generated=j?.generated_at_utc ?? '—';
        document.getElementById(el).textContent=`Atualizado: ${generated} | eventos: ${total}`;
        document.getElementById(el).classList.add('ok');
      }catch(e){document.getElementById(el).textContent='Ainda não publicado.'}
    }
    status('./latest-6h.json','s6');
    status('./latest-24h.json','s24');
  </script>
</body>
</html>
